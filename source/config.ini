# config.ini - 构建/测试的集中配置 (扁平 key=value, 无 [section] 头)
#
# 解析方式: 由 shell 读取 (scripts/lib.sh 里的 cfg()), 支持整行 `#` 注释与行内
# `#` 注释.  注意: 这是「无 section 头」的 properties 风格文件, 若改用 Python 的
# configparser 直接读会报 MissingSectionHeaderError -- 那种解析器要求文件顶部有
# 一个 section 头.  若需兼容, 在文件最前面加一行 `[build]` 即可 (shell 解析会忽略
# 该行).  我们不用 configparser, 故保持精简.
#
# 各键含义:
#   CMAKE_BUILD_TYPE      构建类型 (Debug / Release / …)
#   Ubuntu-{x64,arm64}    构建环境: 使用 ubuntu:<VER> 容器镜像
#   cxx-{x64,arm64}       编译 Fast DDS 相关库的编译器 (g++)
#   test-cxx-{x64,arm64}  编译测试用例的编译器 (clang, 与 cxx 共享 libstdc++)

CMAKE_BUILD_TYPE=Debug
Ubuntu-x64=18.04
Ubuntu-arm64=20.04
cxx-x64=g++-7
cxx-arm64=g++-9
test-cxx-x64=clang-6
test-cxx-arm64=clang-12
